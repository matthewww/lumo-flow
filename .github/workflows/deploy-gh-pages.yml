name: Deploy to GitHub Pages

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main  # Replace with your default branch if it's not `main`

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4.3.1

    # Step 2: Set up Node.js or other environment (if necessary)
    # You can remove this step if your project doesn't require Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '20'

    # Step 3: Install dependencies (if required)
    - name: Install dependencies
      run: npm install

    # Step 4: Build your site (adjust this to the specific build commands for your project)
    - name: Build the site
      run: npm run build

    # Step 5: Deploy to GitHub Pages
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist  # Updated to match Vite build output directory
